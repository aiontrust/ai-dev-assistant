name: Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # CI=true makes compiler warnings fail the build
      - run: npm run build
        env:
          CI: true

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # ffmpeg converts Safari recordings; one test runs it for real
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r backend/requirements.txt pytest httpx
      - run: pytest -q tests/backend
        env:
          PYTHONPATH: backend

  avatar:
    name: Avatar tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: avatar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: avatar/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Demo is servable from the site root
        run: node --input-type=module -e "
          import { readdirSync, readFileSync } from 'node:fs';
          for (const page of ['index.html', 'demo.html', 'embed.html']) {
            const html = readFileSync('dist/' + page, 'utf8');
            if (!html.includes('./assets/')) throw new Error(page + ' is missing relative asset URLs');
            if (html.includes('crossorigin')) throw new Error(page + ' still has crossorigin');
          }
          const bundled = readdirSync('dist/assets')
            .filter((name) => name.endsWith('.js'))
            .map((name) => readFileSync('dist/assets/' + name, 'utf8'))
            .join('\n');
          if (!bundled.includes('placeholder-bust')) throw new Error('procedural placeholder is not in dist');
          "
