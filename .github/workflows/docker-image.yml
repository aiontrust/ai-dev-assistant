name: ci

on:
  push:
    branches:
      - "main"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}
      - name: Validate Docker Hub credentials
        run: echo "$DOCKER_PAT" | docker login -u "$DOCKER_USER" --password-stdin
      - name: Ensure Docker repository exists
        run: |
          if ! docker pull ${{ vars.DOCKER_USER }}/ai-dev-assistant:latest; then
            echo "Repository does not exist. Please create it on Docker Hub."
            exit 1
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: "aiontrust/ajax"
          install: true
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          tags: "${{ vars.DOCKER_USER }}/aiontrust/ai-dev-assistant:latest"
          # For pull requests, export results to the build cache.
          # Otherwise, push to a registry.
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || 'type=registry' }}
  
