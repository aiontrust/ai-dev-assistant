version: '3.8'

services:
  aidevassistant:
    image: aidevassistant

  backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    ports:
      - 8000:8000
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      - frontend
  
  python-executor:
    image: python:3.9
    volumes:
      - ./backend:/app
  cpp-executor:
    image: gcc:latest
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    command: [ "npm", "start" ]
    volumes:
      - ./frontend:/app
