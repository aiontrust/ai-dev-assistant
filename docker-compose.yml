version: '3.8'

services:
  aidevassistant:
    image: aidevassistant

  backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    ports:
      - 8000:8000
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      - frontend

  frontend:
    build:
      context: ./frontend
    ports:
      - "8000:8000"
    command: [ "npm", "start" ]
    volumes:
      - ./frontend:/app
